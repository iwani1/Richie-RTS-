# Quality gates on every push and pull request.
#
# Two jobs, because the application now has two kinds of proof:
#   1. quality-gates  — typecheck, lint, unit/UI tests with coverage thresholds, production build,
#                       dependency audit. No database needed.
#   2. integration    — the same suite the brief cares most about: real PostgreSQL, real
#                       constraints (double booking, append-only audit, monotonic odometer).
#
# The integration job has never been observed on a GitHub runner from this development
# environment; the suite itself runs green locally against PostgreSQL 18.4.

name: ci

# Every branch, not just main: work on a feature branch is exactly when the gates are worth
# running, and until this changed no run had ever executed (audit F-06).
on:
  push:
  pull_request:

# Superseded runs on the same ref are cancelled; only the newest one matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The job never pushes; do not leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # .nvmrc and package.json engines both require 20.19+.
          node-version: 22
          cache: npm

      - name: Install (exact lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Production dependencies gate the deployable artifact.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev dependencies run on the runner and in every contributor's shell, so they are
      # audited too. This is a hard gate.
      - name: Audit all dependencies
        run: npm run audit:dev -- --audit-level=high

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          if-no-files-found: error
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: richie_tms_test
          POSTGRES_USER: richie
          POSTGRES_PASSWORD: ci-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U richie -d richie_tms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrate the scratch database
        env:
          DATABASE_URL: postgresql://richie:ci-not-a-secret@127.0.0.1:5432/richie_tms_test
          SESSION_SECRET: ci-only-session-secret-at-least-32-characters
        run: npm run db:migrate

      # These fail the job; they are never allowed to silently skip.
      - name: Integration tests (real PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://richie:ci-not-a-secret@127.0.0.1:5432/richie_tms_test
        run: npm run test:integration
