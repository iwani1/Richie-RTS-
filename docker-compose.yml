# PostgreSQL for Richie TMS.
#
#   docker compose up -d db      (or: podman-compose up -d db)
#   docker compose ps            wait for "healthy"
#
# The database is published on 127.0.0.1 only: this is a workstation deployment, so the database
# must not be reachable from the office network. The application connects over localhost.
#
# A named volume is used rather than a bind mount, so SELinux on Fedora needs no relabel (`:Z`)
# and `podman` works as well as `docker`.
services:
  db:
    # Fully qualified on purpose: with a short name (`postgres:18-alpine`) Podman stops and asks
    # which registry to use, which breaks a copy-paste first run on Fedora. docker.io is the
    # official image. If your organisation mirrors images, change this one line.
    image: docker.io/library/postgres:18-alpine
    container_name: richie-tms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: richie_tms
      POSTGRES_USER: richie
      # Read from .env, the same file the application uses (compose substitutes ${...} from the
      # project's .env). Set it before the first start and keep DATABASE_URL in step. Changing it
      # after the volume exists does not change the password already stored there.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation/encoding: mixed locales are a classic source of "works on my machine".
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - richie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U richie -d richie_tms"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  richie_pgdata:
